[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "vcardqr"
version = "0.1.0"
description = "Generate RFC 6350 vCard QR codes with a centered logo badge"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Fabien Nisol" }
]
dependencies = [
  "qrcode[pil]>=7.4",
  "Pillow>=10.0",
  "PyYAML>=6.0.1"
]

[project.scripts]
vcardqr = "vcardqr.cli:main"

[tool.hatch.build.targets.sdist]
include = ["src/vcardqr", "README.md", "LICENSE", "examples"]

[tool.hatch.build.targets.wheel]
packages = ["src/vcardqr"]
